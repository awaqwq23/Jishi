name: Verify and build client candidates
on:
  push:
    branches: [codex/reminders-points-shop]
    paths: ["clients/**", "scripts/**", "server/**", "package*.json", ".github/workflows/build-clients.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm test --workspace @jishi/windows
      - run: npm run build:windows
      - name: Install and smoke test the Windows candidate
        shell: pwsh
        run: |
          $installer = Get-ChildItem '.local/build/windows/Jishi-Windows-Setup-*.exe' | Select-Object -First 1
          $installDirectory = Join-Path $env:RUNNER_TEMP 'jishi-installed-smoke'
          $process = Start-Process -FilePath $installer.FullName -ArgumentList '/S', "/D=$installDirectory" -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          node scripts/smoke-windows.cjs (Join-Path $installDirectory '记时.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Installed application smoke failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: windows-candidate
          path: .local/build/windows/Jishi-Windows-Setup-*.exe
          include-hidden-files: true
          if-no-files-found: error
  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high
      - run: npm run sync --workspace @jishi/android
      - working-directory: clients/android/android
        run: bash gradlew assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-candidate
          path: .local/build/android/app/outputs/apk/release/*.apk
          include-hidden-files: true
          if-no-files-found: error
