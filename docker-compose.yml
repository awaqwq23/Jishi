services:
  app:
    build:
      context: .
      dockerfile: deploy/selfhost/Dockerfile
    restart: unless-stopped
    volumes:
      - jishi_data:/data
    mem_limit: 520m
    cpus: 1.0
  oauth2-proxy:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.8.1
    restart: unless-stopped
    environment:
      OAUTH2_PROXY_PROVIDER: github
      OAUTH2_PROXY_CLIENT_ID: ${OAUTH_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OAUTH_COOKIE_SECRET}
      OAUTH2_PROXY_REDIRECT_URL: ${OAUTH_REDIRECT_URL}
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_UPSTREAMS: static://202
      OAUTH2_PROXY_HTTP_ADDRESS: 0.0.0.0:4180
      OAUTH2_PROXY_COOKIE_SECURE: "true"
    mem_limit: 96m
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./deploy/selfhost/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [app, oauth2-proxy]
    mem_limit: 48m
volumes:
  jishi_data:
