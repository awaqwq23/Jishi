services:
  server:
    build:
      context: .
      dockerfile: server/deploy/selfhost/Dockerfile
    restart: unless-stopped
    volumes:
      - jishi_data:/data
    environment:
      AUTH_SECRET: ${AUTH_SECRET}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:8080}
    mem_limit: 260m
    cpus: 0.7
  web:
    build:
      context: .
      dockerfile: clients/web/Dockerfile
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://server:8787
    mem_limit: 300m
    cpus: 0.7
  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes:
      - ./server/deploy/selfhost/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on: [server, web]
    mem_limit: 48m
volumes:
  jishi_data:
