events { worker_connections 256; }
http {
  limit_req_zone $binary_remote_addr zone=jishi_auth:10m rate=10r/m;
  server_tokens off;
  client_max_body_size 6m;
  server {
    listen 8080;

    location ~ ^/api/auth/(login|register)$ { limit_req zone=jishi_auth burst=5 nodelay; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header Host $host; proxy_pass http://server:8787; }
    location /api/ {
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $host;
      proxy_pass http://server:8787;
    }
    location / {
      proxy_set_header X-Forwarded-Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Host $host;
      proxy_pass http://web:3000;
    }
  }
}
