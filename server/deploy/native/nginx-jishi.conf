limit_req_zone $binary_remote_addr zone=jishi_auth:10m rate=10r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    # Keep the nip.io host so already-installed clients can still connect and update.
    server_name awaqwq233.com jishi-104-214-169-232.nip.io;
    client_max_body_size 6m;
    server_tokens off;
    limit_req_status 429;
    error_page 429 = @jishi_rate_limited;
    location @jishi_rate_limited {
        default_type application/json;
        add_header Retry-After 60 always;
        add_header Cache-Control no-store always;
        return 429 '{"error":"Too many requests. Please retry later."}';
    }
    location ^~ /cdn-cgi/local/ { return 404; }
    location ~ /\.(?!well-known(?:/|$)) { return 404; }


    location ~ ^/api/auth/(login|register)$ {
        limit_req zone=jishi_auth burst=5 nodelay;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_set_header x-auth-request-email "";
        proxy_set_header x-auth-request-user "";
        proxy_set_header x-jishi-auth-proxy-secret "";
        proxy_pass http://127.0.0.1:8787;
    }

    location /api/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_set_header x-auth-request-email "";
        proxy_set_header x-auth-request-user "";
        proxy_set_header x-jishi-auth-proxy-secret "";
        proxy_pass http://127.0.0.1:8787;
    }

    location = /health {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header oai-authenticated-user-id "";
        proxy_set_header oai-authenticated-user-email "";
        proxy_set_header oai-authenticated-user-full-name "";
        proxy_set_header x-auth-request-email "";
        proxy_set_header x-auth-request-user "";
        proxy_set_header x-jishi-auth-proxy-secret "";
        proxy_pass http://127.0.0.1:8787;
    }

    location = /updates/latest.json {
        alias /var/www/jishi-downloads/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /downloads/ {
        alias /var/www/jishi-downloads/;
        autoindex off;
        add_header Cache-Control "public, max-age=86400, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        types {
            application/vnd.android.package-archive apk;
            application/octet-stream exe;
        }
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_pass http://127.0.0.1:3000;
    }
}
