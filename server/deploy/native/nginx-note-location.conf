# Insert these locations into the existing awaqwq233.com HTTPS server block.
# They preserve /heartbeat/ and proxy only Jishi's /note/ path plus immutable
# framework assets to the existing Jishi production server.

location = /note {
    return 308 /note/;
}

location /note/ {
    client_max_body_size 6m;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_ssl_name jishi-104-214-169-232.nip.io;
    proxy_set_header Host jishi-104-214-169-232.nip.io;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Prefix /note;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_pass https://jishi-104-214-169-232.nip.io/;
}

location /_next/ {
    proxy_ssl_server_name on;
    proxy_ssl_name jishi-104-214-169-232.nip.io;
    proxy_set_header Host jishi-104-214-169-232.nip.io;
    proxy_pass https://jishi-104-214-169-232.nip.io/_next/;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}
