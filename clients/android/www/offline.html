<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>记时 · 连接失败</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;padding:28px;display:grid;place-items:center;background:#f4f0e8;color:#45433f;font-family:system-ui,"Microsoft YaHei",sans-serif}.card{width:min(430px,100%);padding:30px;border:1px solid #ded7cb;border-radius:24px;background:#fffdf8;box-shadow:0 18px 60px rgba(54,42,29,.09);text-align:center}.mark{width:58px;height:58px;margin:0 auto 18px;display:grid;place-items:center;border-radius:19px;background:#d96f4b;color:white;font-size:26px}h1{margin:0 0 10px;font-size:23px}p{margin:0;color:#736d64;font-size:13px;line-height:1.75}.actions{display:grid;gap:10px;margin-top:24px}button{min-height:46px;border:1px solid #d8d0c4;border-radius:13px;background:white;color:#45433f;font-size:14px}button.primary{border-color:#d96f4b;background:#d96f4b;color:white}.detail{margin-top:18px;padding-top:16px;border-top:1px solid #e6dfd4;font-size:11px;color:#8b8479}
  </style>
</head>
<body>
  <main class="card">
    <div class="mark">记</div>
    <h1>暂时无法连接服务器</h1>
    <p>服务器当前可能正在更新，或手机网络、DNS、证书连接暂时异常。你的账号和待办数据不会因此丢失。</p>
    <div class="actions">
      <button class="primary" onclick="location.href='https://awaqwq233.com/note/?retry='+Date.now()">重新连接主服务器</button>
      <button onclick="location.href='https://jishi-104-214-169-232.nip.io/?retry='+Date.now()">尝试备用服务器</button>
    </div>
    <div class="detail">主站：awaqwq233.com/note/　·　备用服务器：104.214.169.232</div>
  </main>
</body>
</html>
